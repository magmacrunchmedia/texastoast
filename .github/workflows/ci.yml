name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be run against a branch without opening a pull request first.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # tkinter needs a display. Without xvfb the UI tests skip rather than run,
      # which would quietly hide regressions in the renderer and game loop.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

      # `tui` matters as much as the display does below: without it the whole
      # terminal backend suite skips and CI reports green having never
      # constructed a TuiGame. The no-hard-deps tests still pass with Textual
      # installed — they check what `import texastoast` pulls in, in a
      # subprocess, not what happens to be on the machine.
      - run: pip install -e ".[dev,sprites,tui]"

      # TEXASTOAST_REQUIRE_TK turns a missing display into a failure instead of
      # letting the UI tests skip and report green.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          TEXASTOAST_REQUIRE_TK: "1"
        run: xvfb-run -a pytest -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        env:
          TEXASTOAST_REQUIRE_TK: "1"
        run: pytest -v

  # The configuration a Raspberry Pi OS Lite image actually has: Linux, no
  # tkinter, no display, no extras. The matrix above cannot cover it — it
  # installs python3-tk and sets TEXASTOAST_REQUIRE_TK=1 — which is how a leak
  # that made `import texastoast; texastoast.Config` pull tkinter in went
  # unnoticed. python:*-slim omits the Tk libraries, so the absence is real
  # here rather than simulated with sys.modules as the unit tests must.
  headless:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      # Fail loudly rather than vacuously. If a base-image change ever ships Tk
      # again, this job would otherwise keep reporting green while testing
      # nothing it exists to test — the same trap TEXASTOAST_REQUIRE_TK guards
      # against on the display side.
      - name: Confirm tkinter really is absent
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            echo "::error::tkinter is importable here, so this job no longer tests the headless path"
            exit 1
          fi
          echo "tkinter absent, as intended"

      # No extras: this is what a bare `pip install texastoast` gives the Pi.
      - run: pip install -e ".[dev]"

      - name: Import the engine with no display, no tkinter and no extras
        run: |
          python -c "
          import texastoast
          for name in ('Config', 'GameLoop', 'ManualScheduler', 'TuiRenderer',
                       'CellBuffer', 'TileMap', 'Entity', 'InputState',
                       'MagmaHub', 'SimBus', 'Menu', 'Mixer'):
              getattr(texastoast, name)
          print('engine imports clean on', texastoast.__version__)
          "

      # The tk-backed tests skip here by design; everything else must pass.
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

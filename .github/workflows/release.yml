name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing: GitHub mints a short-lived identity token that PyPI
      # verifies. No API token, no repository secret, nothing to rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('texastoast/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match __version__ $PKG"
            exit 1
          fi

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes

  # Tell the website to re-embed the playground engine now rather than at its
  # weekly backstop sync. Tags only: a manual run from main has no released
  # version to point the website at. Needs WEBSITE_DISPATCH_TOKEN, the same
  # fine-grained PAT the magmascript repo uses (Contents read/write on
  # magmacrunchmedia/magmacrunch.com).
  sync-playground:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for texastoast $VERSION to be available on PyPI..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/texastoast/$VERSION/json")
            if [ "$STATUS" = "200" ]; then
              echo "Package available on PyPI (attempt $i)"
              exit 0
            fi
            echo "  Not yet (HTTP $STATUS), waiting 30s... (attempt $i/10)"
            sleep 30
          done
          echo "Package never appeared on PyPI; not dispatching a sync to a version pip cannot install"
          exit 1

      - name: Dispatch playground sync
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/magmacrunchmedia/magmacrunch.com/dispatches \
            -d '{"event_type":"texastoast-release","client_payload":{"version":"${{ steps.version.outputs.version }}"}}'

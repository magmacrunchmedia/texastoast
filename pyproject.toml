[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "texastoast"
dynamic = ["version"]
description = "Python RPG engine with I2C hardware abstraction for magmacrunch game systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "magmacrunch media" },
]
keywords = ["game", "rpg", "tkinter", "i2c", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# Discovered by magmascript when both packages are installed, exposing the
# engine to .mgs scripts. Neither package depends on the other. Not named
# `toast`: magmascript's CLI already uses that verb for clearing caches.
# `tt` is the same domain under a shorter name, for scripts that say it a lot.
[project.entry-points."magmascript.domains"]
texastoast = "texastoast.mgs:TexastoastDomain"
tt = "texastoast.mgs:TexastoastDomain"

# In the package (not tools/) so a pip install on the Pi gets it too.
[project.scripts]
texastoast-bench = "texastoast.devtools.bench:main"

[project.urls]
Homepage = "https://magmacrunch.com/ware/texastoast/"
Source = "https://github.com/magmacrunchmedia/texastoast"
Issues = "https://github.com/magmacrunchmedia/texastoast/issues"
Documentation = "https://github.com/magmacrunchmedia/texastoast/wiki"
Changelog = "https://github.com/magmacrunchmedia/texastoast/blob/main/CHANGELOG.md"

[project.optional-dependencies]
hardware = ["smbus2>=0.6"]
sprites = ["Pillow>=9.0"]
audio = ["pygame-ce>=2.4"]
dev = ["pytest>=7.0", "ruff>=0.6"]

# Version is read from the package so it is defined in exactly one place.
[tool.hatch.version]
path = "texastoast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["texastoast"]
# Ship the PEP 561 marker so consumers get the inline type annotations.
artifacts = ["texastoast/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "texastoast",
    "tests",
    "examples",
    "tools",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are left to line-length, not hard-failed
]

[tool.ruff.lint.per-file-ignores]
# Examples read top-to-bottom as tutorials; imports next to their use is
# deliberate there.
"examples/*" = ["E402"]
